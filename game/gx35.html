//画像の取得
//d1:種類 [0]共通画像 [1]各画像 [2]csv
//d2:画像の管理番号
async function f19(url,id,d1,d2)
{
//console.log("f19 url:"+url+" id:"+id+" d1:"+d1+" d2:"+d2);
	const lang=document.getElementById('lang').value;
	//fetch("http://localhost/nekofes.php", {
	const response = await fetch(url, {
			method: 'POST',
		headers: { 'Content-Type': 'application/json' },
		body: JSON.stringify({
			n1: 6,//脳トレ
			n2: 35,//符号穴埋め問題
			n3: 1,
			n4: 1,
			d1: d1,//種類 [0]共通画像 [1]各画像 [2]csv
			d2: d2,//画像の種類
			d3: 1,
			d4: 1,//
			d5: 1,//
			lang: lang
		}),
	});
	//responseから「blob」としてデータを取り出す
    const blob = await response.blob(); 
	const url2 = URL.createObjectURL(blob);
//console.log("(1)画像URL--:", url2);
	const img = document.getElementById(id);
//console.log("img1 before:", img.src);
	img.src = url2;
//console.log("img1 after:", img.src);
}

function applyTextAll(langCd, divIds) {
  divIds.forEach((id) => applyText(langCd, id));
}

// (1) 取得：langCdとdivのidを渡してHTML文字列を返す
function getText(langCd, divId) {
  // 言語がなければ日本語にフォールバック、該当idがなければ空文字
  return (text[langCd] && text[langCd][divId]) ?? (text.ja && text.ja[divId]) ?? '';
}
// (2) 反映：langCdとdivのidを渡してDOMに流し込む
function applyText(langCd, divId) {
  const el = document.getElementById(divId);
  if (!el) return;
  el.innerHTML = getText(langCd, divId);
}
